name: Website

# Builds the site (site/ plus a translated copy per language from content/i18n/) and deploys it to GitHub Pages.
# One-time setup: repo Settings > Pages > Build and deployment > Source = "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["site/**", "content/i18n/**", "tools/i18n.mjs", "tools/llms.mjs", "tools/stats.mjs", "docs/release-notes/**", "package.json", "package-lock.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build the site in every language
        run: |
          npm ci
          node tools/i18n.mjs build --out _site
          node tools/stats.mjs _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
